<div class="flex row wrap" style="align-items: center; justify-content: center; width: 100%;">
    <div class="flex column" style="align-items: center; margin: 0 10px;">
        <div class="name" style="margin-bottom: 5px;">
            <b>{{localize "TITLE.PROFIT_FACTOR"}}</b>
        </div>
        <div class="flex row" style="align-items: center;">
            <input class="total" type="number" value="{{profitFactor}}" data-dtype="Number" disabled 
                   style="font-size: 24px; height: 50px; width: 50px; text-align: center;"/>
            <div class="information" style="display: flex; flex-direction: column; margin-left: 5px;">
                <input class="bonus" type="number" value="{{profitFactorBonus}}" data-dtype="Number" disabled 
                       style="height: 24px; width: 24px; text-align: center; margin: 1px;"/>
            </div>
        </div>
    </div>
</div>
